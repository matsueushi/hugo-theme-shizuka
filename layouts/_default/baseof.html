<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "ja" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
<div class="site-wrapper">
  <header class="site-header">
    {{- partial "header.html" . -}}
  </header>

  <main>
    <div class="container">
      {{- block "main" . }}{{- end }}
    </div>
  </main>

  <footer class="site-footer">
    {{- partial "footer.html" . -}}
  </footer>
</div>
</body>
</html>
