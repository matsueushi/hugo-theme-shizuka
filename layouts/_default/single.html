{{ define "main" }}
<article>
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年01月02日" }}</time>
      {{- with .Section }}
      <span>&middot; <a href="{{ ($.Site.GetPage (printf "/%s" .)).RelPermalink }}">{{ ($.Site.GetPage (printf "/%s" .)).Title }}</a></span>
      {{- end }}
      {{- with .Params.tags }}
      <ul class="tag-list">
        {{- range . }}
        <li class="tag-item"><a href="/tags/{{ urlize . }}/">{{ . }}</a></li>
        {{- end }}
      </ul>
      {{- end }}
    </div>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
